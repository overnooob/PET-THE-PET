<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3b8be3" id="themeMeta">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PET THE PET!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1236}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Montserrat','Gotham','Arial Black',system-ui,sans-serif;font-weight:700;color:#fff;
  background:#0a2a7a;overflow-x:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none;
}
button{font-family:inherit;font-weight:800;cursor:pointer}

/* ---------- blue shard background ---------- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:
   radial-gradient(1000px 700px at 50% 45%,rgba(90,170,255,.55),transparent 62%),
   linear-gradient(160deg,#071a56 0%,#0e3fb8 52%,#2a86ff 100%)}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(2,8,40,.55))}
.shard{position:absolute;animation:shard ease-in-out infinite;will-change:transform}
@keyframes shard{0%,100%{transform:translate(0,0) rotate(var(--r))}50%{transform:translate(var(--mx),var(--my)) rotate(calc(var(--r) + 6deg))}}

/* ---------- layout ---------- */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:12px 14px 20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px}
.logo{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:40px;font-weight:900;letter-spacing:.5px;white-space:nowrap;
  color:#ffe14d;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);text-align:center;line-height:1;pointer-events:none}

.cur{position:relative;min-width:180px;padding:5px 52px 5px 58px;border-radius:15px;background:linear-gradient(180deg,rgba(14,24,78,.92),rgba(6,12,46,.92));border:3px solid var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 4px 0 var(--ink)}
.cur .ci{position:absolute;left:-7px;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:30px;border:3px solid var(--ink);box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 3px 0 var(--ink)}
.cur.cash .ci{background:linear-gradient(180deg,#8dffa8,#1faa4b)}
.cur.dia .ci{background:linear-gradient(180deg,#a8f4ff,#2a8dff)}
.cur .val{font-size:27px;font-weight:900;line-height:1.15;text-shadow:0 2px 0 rgba(0,0,0,.55)}
.cur.cash .val{color:#8dffa8}
.cur.dia .val{color:#8fe9ff}
.cur.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.09)}}
.plus{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:9px;border:3px solid var(--ink);color:#fff;font-size:21px;font-weight:900;line-height:1;padding:0;
  background:linear-gradient(180deg,#8dffa8,#22c55e 55%,#13873f);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 3px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.45);transition:transform .08s}
.plus:hover{transform:translateY(-50%) scale(1.12)}
.plus:active{transform:translateY(-35%)}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.45);margin:2px 0 1px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4cc9f0,#b5f6ff);border-radius:5px;transition:width .1s linear}
.dsub{font-size:10.5px;color:#a9c7ff;letter-spacing:.3px}

/* ---------- buttons ---------- */
.btn{--c:#2ecc71;position:relative;isolation:isolate;border:3px solid var(--ink);border-radius:13px;padding:8px 16px;color:#fff;font-size:17px;font-weight:900;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 50%,color-mix(in srgb,var(--c) 78%,#000) 100%);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.55),0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.5);
  transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap}
.btn::before,.dbtn::before,.xbtn::before,.tgl::before{content:'';position:absolute;left:3px;right:3px;top:2px;height:46%;z-index:-1;border-radius:10px 10px 50% 50%/10px 10px 70% 70%;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,.06));pointer-events:none}
.btn:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.55),0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.4),0 1px 0 var(--ink)}
.btn.green{--c:#22c55e}.btn.blue{--c:#2f8bff}.btn.red{--c:#ff4d5e}.btn.gold{--c:#ffb11f}.btn.pink{--c:#ff3d9a}
.btn.disabled{filter:grayscale(.9) brightness(.6)}
.btn.disabled:hover{filter:grayscale(.9) brightness(.6);transform:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.55),0 5px 0 var(--ink)}

/* ---------- left dock ---------- */
.dock{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:20}
.dbtn{--c:#2f8bff;position:relative;isolation:isolate;width:84px;padding:7px 0 6px;border:3px solid var(--ink);border-radius:17px;color:#fff;text-align:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 66%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 76%,#000));
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.55),0 6px 0 var(--ink);transition:transform .1s,box-shadow .08s}
.dbtn::before{border-radius:13px 13px 50% 50%/13px 13px 70% 70%;height:44%}
.dbtn:hover{transform:translateY(-3px) rotate(-2deg) scale(1.04)}
.dbtn:active{transform:translateY(4px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.4),0 2px 0 var(--ink)}
.dbtn .e{font-size:31px;line-height:1.1;display:block;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
.dbtn .l{font-size:11px;font-weight:900;display:block;line-height:1.1;margin-top:2px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
.dbtn.orange{--c:#ff9a1f}.dbtn.green{--c:#22c55e}.dbtn.blue{--c:#2f8bff}.dbtn.gray{--c:#7d8bb8}.dbtn.purple{--c:#a855f7}
.dbtn.shop{--c:#ff3d9a;animation:shopPulse 1.5s ease-in-out infinite}
@keyframes shopPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.dbtn.shop::after{content:'';position:absolute;inset:-6px;border-radius:21px;border:3px solid #ffe14d;opacity:0;animation:halo 1.5s ease-out infinite;pointer-events:none}
@keyframes halo{0%{opacity:.9;transform:scale(.95)}100%{opacity:0;transform:scale(1.18)}}

/* ---------- center / pet ---------- */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-top:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:40px}
.boostchip{--c:#ffb11f;border:3px solid var(--ink);border-radius:12px;padding:3px 13px;font-size:14px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c));box-shadow:0 4px 0 var(--ink);animation:chip 1.2s ease-in-out infinite}
.boostchip.fast{--c:#2f8bff}
@keyframes chip{50%{transform:translateY(-3px)}}
.petname{font-size:36px;font-weight:900;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);line-height:1.1;text-align:center}
.petpower{font-size:17px;font-weight:900;color:#8dffa8;background:linear-gradient(180deg,rgba(14,24,78,.92),rgba(6,12,46,.92));border:3px solid var(--ink);padding:2px 16px;border-radius:12px;text-shadow:0 2px 0 rgba(0,0,0,.5);box-shadow:0 3px 0 var(--ink)}
.stage{position:relative;width:min(460px,92%);height:360px;display:grid;place-items:center}
.pedestal{position:absolute;bottom:20px;left:50%;width:330px;height:74px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse at 50% 38%,#e8f6ff 0 18%,#7cc4ff 45%,#2f7bff 72%,#1448b8 100%);
  border:4px solid var(--ink);box-shadow:inset 0 5px 0 rgba(255,255,255,.55),0 9px 0 var(--ink),0 0 70px rgba(120,200,255,.85);animation:pedGlow 2.4s ease-in-out infinite}
@keyframes pedGlow{50%{box-shadow:inset 0 5px 0 rgba(255,255,255,.55),0 9px 0 var(--ink),0 0 100px rgba(150,220,255,1)}}
@keyframes spin{to{transform:rotate(360deg)}}
#pet{position:relative;z-index:2;cursor:pointer;padding:10px 26px;-webkit-user-drag:none;transform-origin:50% 90%}
#pet.hit{animation:hit .28s cubic-bezier(.3,1.7,.5,1)}
#petEmoji{display:block;font-size:182px;line-height:1;transform-origin:50% 95%;animation:idle 2.6s ease-in-out infinite;filter:drop-shadow(0 16px 8px rgba(0,0,0,.4))}
@keyframes idle{0%,100%{transform:scale(1,1) translateY(0)}45%{transform:scale(1.04,.95) translateY(2px)}75%{transform:scale(.97,1.04) translateY(-9px)}}
@keyframes hit{0%{transform:scale(1)}25%{transform:scale(.78,1.18) rotate(-9deg);filter:brightness(1.5)}55%{transform:scale(1.16,.88) rotate(6deg)}80%{transform:scale(.96,1.04) rotate(-2deg)}100%{transform:scale(1)}}
.hint{font-size:15px;font-weight:800;color:#d6e6ff;text-shadow:0 2px 0 rgba(0,0,0,.5);animation:hintb 2s ease-in-out infinite}
@keyframes hintb{50%{transform:translateY(-3px)}}
.stats{display:flex;gap:10px;margin-top:2px;flex-wrap:wrap;justify-content:center}
.stat{background:linear-gradient(180deg,rgba(14,24,78,.92),rgba(6,12,46,.92));border:3px solid var(--ink);border-radius:12px;padding:3px 13px;font-size:13px;color:#d6e6ff;box-shadow:0 3px 0 var(--ink)}

/* ---------- fx ---------- */
.float{position:fixed;z-index:80;pointer-events:none;font-weight:900;font-size:28px;color:#8dffa8;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:floatUp .95s cubic-bezier(.2,.8,.3,1) forwards}
.float.hand{font-size:34px;-webkit-text-stroke:0;animation-duration:.7s}
.float.gold{color:#ffe14d}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-150px) scale(1)}}
.ring{position:fixed;z-index:79;pointer-events:none;width:30px;height:30px;border:6px solid rgba(255,255,255,.95);border-radius:50%;transform:translate(-50%,-50%) scale(.3);animation:ring .5s ease-out forwards}
@keyframes ring{to{transform:translate(-50%,-50%) scale(4.6);opacity:0;border-width:1px}}
.part{position:fixed;z-index:81;pointer-events:none;width:11px;height:11px;border-radius:3px;border:2px solid var(--ink);animation:part .7s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes part{0%{opacity:1;transform:translate(-50%,-50%) rotate(0) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) rotate(var(--r)) scale(.4)}}

/* ---------- eggs ---------- */
.egg{--s:90px;width:var(--s);height:calc(var(--s)*1.25);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;position:relative;flex:none;border:3px solid var(--ink);
  background:
   radial-gradient(circle at 32% 24%,rgba(255,255,255,.9) 0 7%,transparent 8%),
   radial-gradient(circle at 66% 60%,var(--c3) 0 9%,transparent 10%),
   radial-gradient(circle at 34% 70%,var(--c3) 0 7%,transparent 8%),
   radial-gradient(circle at 70% 32%,var(--c3) 0 6%,transparent 7%),
   linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset -8px -10px 0 rgba(0,0,0,.14),0 6px 0 var(--ink)}
.egg.ex{box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),0 6px 0 var(--ink),0 0 26px #fff,0 0 54px rgba(150,200,255,.9);animation:eglow 1.8s ease-in-out infinite}
.egg.ex.choc{box-shadow:inset -8px -10px 0 rgba(0,0,0,.18),0 6px 0 var(--ink),0 0 26px #d9a273,0 0 54px rgba(123,74,42,.9)}
@keyframes eglow{50%{filter:brightness(1.12)}}
.egg.shake1{animation:sh1 .5s ease-in-out infinite}
.egg.shake2{animation:sh2 .3s ease-in-out infinite}
.egg.shake3{animation:sh3 .16s ease-in-out infinite;filter:brightness(1.4);box-shadow:inset -8px -10px 0 rgba(0,0,0,.14),0 0 60px #fff,0 0 100px #ffe14d}
@keyframes sh1{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes sh2{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-15deg) translateX(-8px) scale(1.04)}75%{transform:rotate(15deg) translateX(8px) scale(1.04)}}
@keyframes sh3{0%,100%{transform:rotate(-20deg) scale(1.1)}50%{transform:rotate(20deg) scale(1.16)}}

/* ---------- windows ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(3,10,48,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay.show{display:grid}
#hatchOv{z-index:70}
#confirmOv{z-index:90}
.win{--bar:#2f8bff;position:relative;width:min(540px,94vw);max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;border:4px solid var(--ink);border-radius:20px;background:linear-gradient(180deg,#27307a,#171e4f);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.18),0 10px 0 var(--ink),0 0 70px rgba(80,150,255,.5);animation:winpop .32s cubic-bezier(.2,1.5,.4,1)}
@keyframes winpop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.wbar{display:flex;align-items:center;padding:10px 14px;border-radius:15px 15px 0 0;border-bottom:4px solid var(--ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bar) 62%,#fff),var(--bar) 55%,color-mix(in srgb,var(--bar) 78%,#000))}
.wbar h2{margin:0;font-size:26px;font-weight:900;margin-right:auto;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.xbtn{position:absolute;right:-14px;top:-16px;width:44px;height:44px;isolation:isolate;border-radius:12px;border:3px solid var(--ink);color:#fff;font-size:22px;font-weight:900;
  background:linear-gradient(180deg,#ff8a95,#ff3d50 55%,#c41f33);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.5);transition:transform .1s;z-index:3}
.xbtn:hover{transform:rotate(8deg) scale(1.1)}
.xbtn:active{transform:translateY(3px)}
.wbody{overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;
  background-image:radial-gradient(rgba(255,255,255,.07) 2.5px,transparent 3px);background-size:24px 24px;border-radius:0 0 16px 16px}
.wbody::-webkit-scrollbar{width:9px}.wbody::-webkit-scrollbar-thumb{background:#4a5bb8;border-radius:6px}
.card{background:linear-gradient(180deg,#2d3a86,#232e70);border:3px solid var(--ink);border-radius:16px;padding:11px;box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 5px 0 var(--ink)}
.card h3{margin:0 0 3px;font-size:19px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.card p{margin:0 0 8px;font-size:13.5px;font-weight:600;color:#bcd0ff;line-height:1.4}
.egg-card{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.egg-card.ex{background:linear-gradient(180deg,#7a2a8e,#3a1c6e);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 5px 0 var(--ink),0 0 26px rgba(255,61,154,.55)}
.egg-card .nm{font-size:19px;font-weight:900;margin-bottom:5px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.odds{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:13px;font-weight:800;background:rgba(5,10,40,.6);border:2px solid var(--rc,#fff);border-radius:10px;padding:1px 8px}
.chip .ico{font-size:1.1em;margin-right:6px}
.shopitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.bigico{font-size:50px;width:66px;text-align:center;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:11px 9px;padding-bottom:8px}
.petcard{position:relative;text-align:center;background:linear-gradient(180deg,#2d3a86,#232e70);border:3px solid var(--rc);border-radius:14px;padding:8px 2px 12px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.petcard:hover{transform:translateY(-3px)}
.petcard:active{transform:translateY(2px)}
.petcard.eq{background:linear-gradient(180deg,#1f8a55,#166a42)}
.petcard .pe{font-size:44px;line-height:1.15}
.petcard .pn{font-size:12px;font-weight:800;padding:0 2px}
.petcard .pp{font-size:12.5px;font-weight:900;color:#8dffa8}
.petcard .px{position:absolute;top:2px;right:6px;font-size:12px;color:#ffe14d;font-weight:900}
.petcard .tag{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);font-size:10px;font-weight:900;background:#22c55e;border:2px solid var(--ink);padding:0 9px;border-radius:8px;letter-spacing:.5px;white-space:nowrap}
.coll{font-size:14px;color:#bcd0ff;text-align:center;font-weight:700}
.balance{display:flex;justify-content:center}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;gap:12px;min-height:44px}
.setrow+.setrow{margin-top:6px}
.setrow .sn{font-size:17px;font-weight:900;margin-right:auto;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.setrow.vol .sn{font-size:14px;margin:0;width:112px;color:#cfe0ff}
.setrow .vv{width:46px;text-align:right;font-size:14px;font-weight:900;color:#8fe9ff}
.tgl{--c:#ff4d5e;position:relative;isolation:isolate;min-width:78px;padding:6px 12px;border:3px solid var(--ink);border-radius:12px;color:#fff;font-size:15px;font-weight:900;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 50%,color-mix(in srgb,var(--c) 78%,#000));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.55),0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.5);transition:transform .08s,box-shadow .08s}
.tgl.on{--c:#22c55e}
.tgl:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 1px 0 var(--ink)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:20px;border-radius:11px;border:3px solid var(--ink);outline:none;cursor:pointer;
  background:linear-gradient(90deg,#2f8bff var(--p,50%),#0b1236 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bcd2ff);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bcd2ff);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}

/* ---------- hatch ---------- */
.hatchwin{position:relative;width:min(520px,94vw);overflow:hidden;border:4px solid var(--ink);border-radius:22px;background:radial-gradient(circle at 50% 35%,#3b5fe0,#1a2663 70%);box-shadow:0 10px 0 var(--ink),0 0 80px rgba(120,190,255,.6);animation:winpop .3s cubic-bezier(.2,1.5,.4,1);text-align:center;padding:14px 8px 18px}
.hatchstage{position:relative;height:270px;display:grid;place-items:center}
.rays{position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,255,255,.34) 0 9deg,transparent 9deg 18deg);
  -webkit-mask-image:radial-gradient(circle,#000 15%,transparent 68%);mask-image:radial-gradient(circle,#000 15%,transparent 68%);animation:spin 7s linear infinite}
.rpet{position:relative;font-size:130px;line-height:1.1;filter:drop-shadow(0 0 24px var(--rc)) drop-shadow(0 12px 0 rgba(0,0,0,.25));
  animation:revealIn .7s cubic-bezier(.2,1.7,.4,1),idle 2.4s ease-in-out .7s infinite}
@keyframes revealIn{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.rname{font-size:32px;font-weight:900;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);animation:rin .5s .15s both}

let AC=null,musicBus=null,sfxBus=null,noiseBuf=null;
function ctx(){
  try{
    if(!AC){
      AC=new(window.AudioContext||window.webkitAudioContext)();
      musicBus=AC.createGain();sfxBus=AC.createGain();
      musicBus.connect(AC.destination);sfxBus.connect(AC.destination);
      const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      applyVolumes(true);
    }
    if(AC.state==='suspended')AC.resume();
    return AC;
  }catch(e){return null}
}
function applyVolumes(instant){
  if(!AC)return;
  const m=S.musicOn?S.musicVol*.6:0,s=S.sfxOn?S.sfxVol:0,t=AC.currentTime;
  if(instant){musicBus.gain.value=m;sfxBus.gain.value=s}
  else{musicBus.gain.setTargetAtTime(m,t,.04);sfxBus.gain.setTargetAtTime(s,t,.04)}
}
function tone(f,d,type,v,t0,f2){
  const a=ctx();if(!a||!S.sfxOn)return;t0=t0||0;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+.02);
}
const sfxTap=()=>{const f=480+Math.random()*160;tone(f,.1,'sine',.1,0,f*1.7);tone(f*2,.06,'triangle',.03,.02)};
const sfxBuy=()=>{tone(660,.1,'square',.05);tone(990,.14,'square',.05,.08)};
const sfxNo=()=>tone(160,.18,'sawtooth',.06,0,90);

/* music: 8-bar happy loop (C G Am F C G F G) */
const BPM=112,STEP=60/BPM/4;
const CH=[[60,64,67],[55,59,62],[57,60,64],[53,57,60],[60,64,67],[55,59,62],[53,57,60],[55,59,62]];
const ROOT=[36,31,33,29,36,31,29,31];
const MEL=[
  [76,0,79,0,81,79,76,0],[74,0,79,0,74,76,74,0],[76,0,81,0,79,76,72,0],[69,0,72,0,76,72,69,0],
  [79,0,76,0,72,76,79,0],[74,0,71,0,74,79,74,0],[72,0,69,0,72,76,81,0],[79,0,74,0,71,74,79,0]];
const mf=m=>440*Math.pow(2,(m-69)/12);
function mnote(m,t,d,type,v){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=mf(m);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+d+.05);
}
function mnoise(t,d,freq,type,v){
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(musicBus);s.start(t,Math.random()*.5);s.stop(t+d+.02);
}
function mkick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
  g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
  o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.2);
}
function playStep(s,t){
  const bar=(s>>4)&7,k=s&15,ch=CH[bar];
  if(k%2===0){
    mnote(ch[[0,1,2,1][(k/2)%4]],t,STEP*1.9,'triangle',.12);
    const m=MEL[bar][k/2];if(m)mnote(m,t,STEP*2.6,'square',.035);
  }
  if(k===0||k===6||k===8||k===12)mnote(ROOT[bar]+(k===12?7:0),t,STEP*3,'triangle',.3);
  if(k===0||k===8)mkick(t);
  if(k===4||k===12)mnoise(t,.12,1800,'bandpass',.2);
  if(k%2===0)mnoise(t,.03,8000,'highpass',k%4===2?.09:.045);
}
let musTimer=null,nextT=0,mstep=0;
function startMusic(){
  const a=ctx();if(!a||musTimer)return;
  nextT=a.currentTime+.15;mstep=0;
  musTimer=setInterval(()=>{
    if(AC.state!=='running')return;
    if(nextT<AC.currentTime-.1)nextT=AC.currentTime+.05;
    while(nextT<AC.currentTime+.3){
      if(S.musicOn)playStep(mstep,nextT);
      nextT+=STEP;mstep=(mstep+1)&127;
    }
  },50);
}
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,startMusic,{passive:true}));

let hatching=false;
function roll(e){
  const ws=weightsFor(e),t=ws.reduce((a,b)=>a+b,0);let r=Math.random()*t;
  for(let i=0;i<e.pets.length;i++){if((r-=ws[i])<0)return e.pets[i]}
  return e.pets[0];
}
const RANK=['Common','Uncommon','Rare','Epic','Legendary','Mythic','Exclusive','Secret'];
function fanfare(pet,r){
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  burst(cx,cy,34);ring(cx,cy);
  if(['Mythic','Exclusive','Secret'].includes(pet.rar)){
    [250,500].forEach(d=>setTimeout(()=>{burst(cx,cy,40);ring(cx,cy)},d));
  }
  if(pet.rar==='Secret'){[750,1000,1250].forEach(d=>setTimeout(()=>{burst(cx,cy,48);ring(cx,cy)},d))}
}
/* ---- auto hatch (repeat button under the Hatching text) ---- */
const autoH={on:false,ok:false,ready:false,id:null,qty:1,timer:null};
function autoBtnHTML(){
  if(!autoH.ok)return '';
  return `<div><button class="btn ${autoH.on?'red':'blue'} autoHatchBtn" data-autohatch="1" title="${autoH.on?'Stop Auto Hatch':'Auto Hatch'}" style="margin-top:8px;font-size:22px;padding:4px 20px">${autoH.on?'🚫':'🔁'}</button></div>`;
}
function refreshAutoBtn(){
  $$('.autoHatchBtn').forEach(b=>{b.textContent=autoH.on?'🚫':'🔁';b.classList.toggle('red',autoH.on);b.classList.toggle('blue',!autoH.on);b.title=autoH.on?'Stop Auto Hatch':'Auto Hatch'});
}
function autoStop(){autoH.on=false;clearTimeout(autoH.timer);autoH.timer=null;refreshAutoBtn()}
function scheduleAuto(){
  clearTimeout(autoH.timer);
  autoH.timer=setTimeout(()=>{
    autoH.timer=null;
    if(!autoH.on||!autoH.ready||!$('#hatchOv').classList.contains('show'))return;
    const e=EGG[autoH.id];
    if(!(S[e.cur]>=priceFor(e,autoH.qty))){
      autoStop();toast({cash:'💵 Not Enough Cash!',dia:'💎 Not Enough Diamonds!'}[e.cur]+' Auto Hatch Stopped');sfxNo();return;
    }
    hatching=false;openEgg(autoH.id,autoH.qty,false,true);
  },1600);
}
function openEgg(id,qty,free,auto){
  qty=qty||1;
  const e=EGG[id];if(hatching)return;
  if(qty===6&&!S.g6){toast('🔒 Unlock x6 Hatch In The Exclusive Shop!');sfxNo();return}
  if(!free&&!pay(e.cur,priceFor(e,qty)))return;
  hatching=true;sfxBuy();
  if(!auto)autoH.on=false;
  clearTimeout(autoH.timer);autoH.timer=null;
  autoH.ok=!free&&id!=='exclusive1';autoH.id=id;autoH.qty=qty;autoH.ready=false;
  const k=S.bHatch>0?HATCH_FAST:1;          // Fast Hatch = 40% faster
  const pets=[],isNew=[];let equipped=null;
  for(let n=0;n<qty;n++){
    const pet=roll(e);pets.push(pet);
    S.pets[pet.id]=(S.pets[pet.id]||0)+1;
    isNew.push(S.pets[pet.id]===1);
    if(petPower(pet)>petPower(PET[getEq()])){setEq(pet.id);equipped=pet}
  }
  const best=pets.reduce((a,b)=>RANK.indexOf(b.rar)>RANK.indexOf(a.rar)||(RANK.indexOf(b.rar)===RANK.indexOf(a.rar)&&petPower(b)>petPower(a))?b:a);
  save();updateHUD();closeWin();
  $('#hatchOv').classList.add('show');
  $('#hatchOk').style.display='none';
  $('#hatchInfo').innerHTML='<div class="rname" style="font-size:26px">Hatching...</div>'+autoBtnHTML();
  const stage=$('#hatchStage');
  stage.className='hatchstage'+(qty===6?' six':'');
  const rows=arr=>qty===6
    ?`<div class="mgrid"><div class="mrow">${arr.slice(0,3).join('')}</div><div class="mrow">${arr.slice(3).join('')}</div></div>`
    :`<div class="mrow">${arr.join('')}</div>`;
  const eggSize=qty===1?124:(qty===6?68:84);
  stage.innerHTML=qty>1?rows(pets.map(()=>eggHTML(e,eggSize))):eggHTML(e,124);
  const eggs=[...stage.querySelectorAll('.egg')];
  const setShake=c=>eggs.forEach((g,i)=>{g.className=g.className.replace(/shake\d/g,'').trim()+' '+c;g.style.animationDelay=(i*0.07)+'s'});
  setShake('shake1');
  let n=0;const iv=setInterval(()=>{tone(260+n*45,.07,'square',.04);n++},200*k);
  setTimeout(()=>setShake('shake2'),750*k);
  setTimeout(()=>setShake('shake3'),1450*k);
  setTimeout(()=>{
    clearInterval(iv);sfxReveal();
    if(qty===1){
      stage.innerHTML=`<div class="rays"></div><div class="rpet" style="--rc:${RAR[best.rar]}">${ico(best)}</div>`;
    }else{
      stage.innerHTML=`<div class="rays"></div>${rows(pets.map((q,i)=>`<div class="mpet" style="--rc:${RAR[q.rar]};animation-delay:${i*.12}s"><div class="rpet">${ico(q)}</div><div class="mn" style="color:${RAR[q.rar]}">${q.name}</div><div class="mr" style="--rc:${RAR[q.rar]}">${q.rar.toUpperCase()}</div>${isNew[i]?'<div class="mnew">NEW!</div>':''}</div>`))}`;
    }
    const flash=document.createElement('div');flash.className='flash';$('.hatchwin').appendChild(flash);setTimeout(()=>flash.remove(),750);
    fanfare(best,stage.getBoundingClientRect());
    const top=best.rar==='Secret'?'<div class="rnew">🌈 SECRET PET! 🌈</div>':(best.rar==='Mythic'?'<div class="rnew">🌈 Mega Rare! 🌈</div>':'');
    if(qty===1){
      $('#hatchInfo').innerHTML=`${top}${isNew[0]?'<div class="rnew" style="font-size:17px">✨ New Pet! ✨</div>':''}
      <div class="rname" style="color:${RAR[best.rar]}">${best.name}</div>
      <div class="rrar" style="--rc:${RAR[best.rar]}">${best.rar.toUpperCase()}</div>
      <div class="rpow">${best.mult?`x${best.mult} Your Best Pet<br>(+${fmtP(petPower(best))} Per Tap)`:`+${fmtP(petPower(best))} Per Tap`}</div>
      ${equipped?'<div style="margin-top:4px;font-size:14px">✅ Equipped Automatically!</div>':''}${autoBtnHTML()}`;
    }else{
      $('#hatchInfo').innerHTML=`${top}
      <div class="rpow" style="margin-top:6px">Best Pull: <span style="color:${RAR[best.rar]}">${best.name}</span></div>
      ${equipped?`<div style="margin-top:4px;font-size:14px">✅ ${equipped.name} Equipped Automatically!</div>`:''}${autoBtnHTML()}`;
    }
    $('#hatchOk').style.display='inline-block';
    autoH.ready=true;if(autoH.on)scheduleAuto();
  },2150*k);
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-locked6]')){toast('🔒 Unlock x6 Hatch In The Exclusive Shop!');sfxNo();openWin('shop');return}
  const it=t.closest('[data-idxtab]');

  const w=t.closest('[data-win]');
  if(w){openWin(w.dataset.win);return}
  if(t.closest('[data-closewin]')||t===$('#win')){closeWin();return}
  const eg=t.closest('[data-egg]');
  if(eg){openEgg(eg.dataset.egg,+eg.dataset.qty||1);return}
  const eq=t.closest('[data-equip]');
  if(eq){setEq(eq.dataset.equip);save();renderPanel();updateHUD();return}
  if(t.closest('[data-fs]')){toggleFS();return}
  const st=t.closest('[data-set]');
  if(st){
    const k=st.dataset.set;S[k]=!S[k];
    if(k==='musicOn'||k==='sfxOn'){ctx();applyVolumes();startMusic()}

    save();renderPanel();if(k==='sfxOn')sfxBuy();return;
  }
  if(t.closest('[data-buyauto]')){
    if(S.auto)return;
    if(pay('cash',AUTO_COST)){S.auto=true;sfxBuy();toast('🤖 Auto Tap Unlocked!');save();renderPanel();updateHUD()}
    return;
  }
  const ci=t.closest('[data-claimidx]');
  if(ci){
    const n=+ci.dataset.claimidx;
    if(ownedCount()<n||(S.idxClaimed||[]).includes(n)){sfxNo();return}
    S.idxClaimed=[...(S.idxClaimed||[]),n];
    if(IDX_PERM[n]==='luck')toast('🍀 +5% Luck Forever! ('+n+' Pets)');
    else if(IDX_PERM[n]==='cash')toast('💰 +10% Cash Forever! ('+n+' Pets)');
    else{S.dia+=IDX_REWARD;toast('💎 +'+IDX_REWARD+' Diamonds! ('+n+' Pets)')}
    sfxBuy();save();renderPanel();updateHUD();return;
  }
  if(t.closest('[data-upgauto]')){
    const lv=S.autoLvl||0;if(lv>=AUTO_UPG.length)return;
    if(pay('cash',AUTO_UPG[lv])){S.autoLvl=lv+1;sfxBuy();toast('⬆️ Auto Tap '+fmtRate(AUTO_RATES[S.autoLvl])+'/s!');save();renderPanel();updateHUD()}
    return;
  }
  if(t.closest('[data-toggleauto]')){S.autoOn=!S.autoOn;save();renderPanel();updateHUD();return}
  const gp=t.closest('[data-gp]');
  if(gp){
    const k=gp.dataset.gp;if(S[k])return;
    if(!pay('dia',k==='g6'?G6_COST:SECRET_COST))return;
    S[k]=true;sfxBuy();
    toast(k==='g6'?'🥚 x6 Hatch Unlocked Forever!':'🌈 Secret Hunter Unlocked! +25% Secret Chance');
    save();renderPanel();updateHUD();return;
  }
  const bb=t.closest('[data-buyboost]');
  if(bb){
    const k=bb.dataset.buyboost;
    if(!pay('dia',BOOST_COSTS[k]))return;
    S.inv[k]=(S.inv[k]||0)+1;sfxBuy();
    toast('🎒 Boost Added! Press Use To Activate It');
    save();updateHUD();return;

  const ub=t.closest('[data-useboost]');

    const k=ub.dataset.useboost;
    if(!(S.inv[k]>0)){sfxNo();return}

    save();if(k==='luck')renderPanel();updateHUD();return;
  }
  if(t.id==='resetBtn'){$('#confirmOv').classList.add('show');return}
  if(t.id==='confirmNo'||t===$('#confirmOv')){$('#confirmOv').classList.remove('show');return}

    const keep={musicOn:S.musicOn,musicVol:S.musicVol,sfxOn:S.sfxOn,sfxVol:S.sfxVol,fx:S.fx,nums:S.nums,hideBoosts:S.hideBoosts,bgAnim:S.bgAnim};
    try{localStorage.removeItem(SAVE_KEY)}catch(err){}
    S=Object.assign(def(),keep);
    lastEq=null;lastCash=-1;lastDia=-1;autoAcc=0;
    applyWorld();save();$('#confirmOv').classList.remove('show');renderPanel();updateHUD();toast('Progress Reset');
    return;

  S.prog+=dt;
  while(S.prog>=60){S.prog-=60;S.dia++;toast('💎 +1 Diamond!');tone(1200,.2,'triangle',.08);tone(1600,.2,'triangle',.06,.1)}
  if(S.bCash>0){S.bCash=Math.max(0,S.bCash-dt);if(S.bCash===0)toast('💰 2x Cash Boost Ended')}
  if(S.bAuto>0&&S.auto){S.bAuto=Math.max(0,S.bAuto-dt);if(S.bAuto===0)toast('⚡ Fast Auto Tap Ended')}
  if(S.bLuck>0){S.bLuck=Math.max(0,S.bLuck-dt);if(S.bLuck===0){toast('🍀 Lucky Ended');if(curTab==='eggs'||curTab==='shop')renderPanel()}}
  if(S.bHatch>0){S.bHatch=Math.max(0,S.bHatch-dt);if(S.bHatch===0)toast('🥚 Fast Hatch Ended')}
  if(S.auto&&S.autoOn){
    autoAcc+=dt;
    const iv=1/autoRate();
    const n=Math.floor(autoAcc/iv);
    if(n>0){autoAcc-=n*iv;autoTapFx(n)}
  }else autoAcc=0;
  saveAcc+=dt;if(saveAcc>=5){saveAcc=0;save()}
  updateHUD();
},100);
window.addEventListener('beforeunload',save);

applyWorld();updateHUD();
</script>
</body>
</html>
